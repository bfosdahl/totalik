    <script>
      window.__TOTALIK_BOOTED__ = false;
      window.__TOTALIK_BOOT_ERROR__ = function (message) {
        var fallback = document.getElementById('boot-fallback');
        if (!fallback || window.__TOTALIK_BOOTED__) return;
        fallback.style.display = 'flex';
        var text = document.getElementById('boot-fallback-text');
        if (text) text.textContent = message || 'Siden bruker litt lang tid på å starte.';
      };
      window.addEventListener('error', function (event) {
        window.__TOTALIK_BOOT_ERROR__(event.message || 'Siden kunne ikke starte automatisk.');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        window.__TOTALIK_BOOT_ERROR__((reason && reason.message) || 'Siden kunne ikke starte automatisk.');
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            caches.delete(key);
          });
        });
      }
      setTimeout(function () {
        if (!window.__TOTALIK_BOOTED__) {
          window.__TOTALIK_BOOT_ERROR__('Siden bruker litt lang tid på å starte.');
        }
      }, 15000);
    </script>
