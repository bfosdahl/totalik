name: E2E Playwright (SJA · Sjekklister · Dagsrapport)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        input_mode: [touch, mouse]
    name: e2e (${{ matrix.browser }} · ${{ matrix.input_mode }})
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_HAS_TOUCH: ${{ matrix.input_mode == 'touch' && '1' || '0' }}
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Playwright (Python) + browser
        run: |
          pip install playwright
          playwright install --with-deps ${{ matrix.browser }}

      - name: Create .env for Vite build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://sffkcqclfiffnpxorodd.supabase.co' }}" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmZmtjcWNsZmlmZm5weG9yb2RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyMTI4MzIsImV4cCI6MjA3OTc4ODgzMn0.Gx3CZwKvWLtNyLPhyJXv5qalkr9CjDrzGkNsfrajF-s' }}" >> .env

      - name: Start dev server
        run: |
          bun run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in {1..60}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server failed to start — tailing log:"
          tail -n 100 /tmp/dev.log
          exit 1

      - name: Run SJA E2E (${{ matrix.browser }} · ${{ matrix.input_mode }})
        id: sja
        run: python3 tests/e2e/sja.spec.py

      - name: Upload SJA debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sja-${{ matrix.browser }}-${{ matrix.input_mode }}-${{ github.run_attempt }}
          path: /tmp/browser/sja-e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Sjekklister E2E (${{ matrix.browser }} · ${{ matrix.input_mode }})
        id: sjekk
        if: always()
        run: python3 tests/e2e/sjekklister.spec.py

      - name: Upload Sjekklister debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sjekklister-${{ matrix.browser }}-${{ matrix.input_mode }}-${{ github.run_attempt }}
          path: /tmp/browser/sjekklister-e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Dagsrapport E2E (${{ matrix.browser }} · ${{ matrix.input_mode }})
        id: dr
        if: always()
        run: python3 tests/e2e/dagsrapport.spec.py

      - name: Upload Dagsrapport debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-dagsrapport-${{ matrix.browser }}-${{ matrix.input_mode }}-${{ github.run_attempt }}
          path: /tmp/browser/dagsrapport-e2e/
          if-no-files-found: ignore
          retention-days: 14

      - name: Aggregate failure summary
        if: failure()
        run: |
          echo "## E2E failure summary — browser=${{ matrix.browser }} input=${{ matrix.input_mode }}" >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/browser/*/*/summary.txt; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          echo "### Dev server log (tail)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/dev.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dev server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log-${{ matrix.browser }}-${{ matrix.input_mode }}-${{ github.run_attempt }}
          path: /tmp/dev.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: kill $(cat /tmp/dev.pid) || true
