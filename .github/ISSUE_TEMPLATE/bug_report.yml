name: 🐞 Bug / feil
description: Meld inn en bug eller feil i Total-IK
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Takk for at du melder inn en feil! Fyll ut så mye du kan – jo mer info, jo raskere kan vi fikse det.
  - type: input
    id: hvor
    attributes:
      label: Hvor i systemet skjer feilen?
      placeholder: "F.eks. KS Bygg → Sjekklister → Signering"
    validations:
      required: true
  - type: textarea
    id: hva
    attributes:
      label: Hva skjedde?
      description: Beskriv feilen med egne ord.
    validations:
      required: true
  - type: textarea
    id: forventet
    attributes:
      label: Hva forventet du skulle skje?
    validations:
      required: false
  - type: textarea
    id: steg
    attributes:
      label: Steg for å reprodusere
      placeholder: |
        1. Gå til ...
        2. Klikk på ...
        3. Se feil
  - type: dropdown
    id: enhet
    attributes:
      label: Enhet
      options:
        - Mobil (iPhone)
        - Mobil (Android)
        - Nettbrett
        - PC / Mac
    validations:
      required: true
  - type: textarea
    id: skjermbilde
    attributes:
      label: Skjermbilde / video (valgfritt)
      description: Dra og slipp filer her.
